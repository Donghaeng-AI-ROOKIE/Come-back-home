# 웹 배포용 nginx 설정 — 맥미니 `comeback-web` 컨테이너에
# /etc/nginx/conf.d/default.conf 로 마운트된다.
#
#   docker run -d --name comeback-web -p 3000:80 \
#     -v ~/comeback-web/dist:/usr/share/nginx/html:ro \
#     -v ~/comeback-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine
#
# 이 파일이 리포에 없어서 맥미니에만 있었고, 그래서 아래 압축 설정이 빠진 채로
# 오래 굴러갔다. 배포 설정도 코드와 같이 남긴다.

# 전송이 **얼마나 걸렸는지**를 남긴다.
# 기본 combined 포맷에는 시간이 없어서, "폰에서 안 열린다" 를 받았을 때
# 서버가 느린 건지 회선이 느린 건지 구분할 수가 없었다. rt=응답에 걸린 초,
# sent=실제로 내보낸 바이트. 둘을 보면 중간에 끊긴 전송도 바로 보인다.
log_format timed '$remote_addr "$request" $status sent=$body_bytes_sent '
                 'rt=$request_time ua="$http_user_agent" ip="$http_x_forwarded_for"';

server {
  listen 80;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log timed;

  # ── 압축 ──────────────────────────────────────────────────────────────
  # 안 켜져 있었다. nginx 기본 이미지는 gzip 이 주석 처리돼 있다.
  #
  # 첫 화면을 그리는 데 필요한 양이 **13MB** 였다(JS 번들 2.7MB + 폰트 4종
  # 10.4MB). PC 유선망은 몇 초면 받지만, Funnel 릴레이를 타는 폰 회선에서는
  # 다 받기 전에 흰 화면에 머문다 — "컴퓨터로는 되는데 폰으로는 안 된다"의
  # 정체다(현장 제보 08-11).
  #
  # 실측 압축률: JS 2.68MB → 약 0.5MB, TTF 2.60MB → 0.85MB(각각).
  # 합계 13.1MB → 약 3.9MB.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  # 폰트(ttf)를 반드시 포함해야 한다 — 여기서 덜어내는 양이 가장 크다.
  gzip_types
    text/plain
    text/css
    application/javascript
    text/javascript
    application/json
    image/svg+xml
    font/ttf
    application/x-font-ttf
    application/font-sfnt;

  # ── 캐시 ──────────────────────────────────────────────────────────────
  # 아래 두 경로의 파일명에는 내용 해시가 박혀 있다
  # (index-0e09f8c….js, 42dotSans-Bold.df8a1352….ttf). 내용이 바뀌면 이름이
  # 바뀌므로 오래 붙잡아 둬도 헌 파일을 보여줄 위험이 없다. 배포를 새로 해도
  # index.html 이 새 이름을 가리키니 그때 새로 받아 간다.
  #
  # 이게 없으면 새로고침할 때마다 폰이 전부 다시 받는다.
  location /_expo/static/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # 폰트는 따로 잡는다 — 이 이미지의 mime.types 에 **ttf 항목이 없어서**
  # application/octet-stream 으로 나가고, 그러면 위 gzip_types 에 걸리지 않는다
  # (실측: gzip 을 켜고도 폰트만 2.60MB 그대로 나갔다).
  # 정규식 location 이 위 prefix 보다 먼저 잡히므로 /assets/ 의 나머지 파일
  # (png·svg)은 원래 mime 타입을 그대로 쓴다.
  location ~* \.ttf$ {
    types { font/ttf ttf; }
    default_type font/ttf;
    gzip on;
    gzip_types font/ttf;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # index.html·sw.js 는 캐시하지 않는다 — 여기가 굳으면 배포가 반영되지 않는다.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # ── API 를 같은 출처로 ────────────────────────────────────────────────
  # 원래 앱은 API 를 `https://<host>:8443` 로 따로 불렀다. 그 구성은 폰에서
  # 두 가지를 요구한다 — **비표준 포트 8443 통과**(학교·사내망이 흔히 막는다)와
  # 별도 TLS 연결. 같은 출처로 붙이면 둘 다 사라지고 CORS 도 필요 없어진다.
  #
  # 끝의 `/` 가 핵심이다 — `/api/auth/login` 이 백엔드의 `/auth/login` 으로 간다.
  # 172.17.0.1 은 컨테이너에서 본 호스트(도커 브리지 게이트웨이)다.
  location /api/ {
    proxy_pass http://172.17.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 예측은 웜에서 10~15초지만, **새 지역의 첫 실행은 2분을 넘긴다** —
    # 그 지역 도로망을 Overpass 에서 처음 내려받기 때문이다(신촌 첫 예측 실측
    # 08-12: 120초에서 잘림). 120s 로 두면 여기서 504 가 나고, 서버는 계산을
    # 끝내는데 앱만 실패로 표시하는 최악의 조합이 된다.
    #
    # 게다가 고신뢰 제보는 층2 재예측을 그 요청 안에서 돌린다 — 중간에 끊기면
    # **사건에 POA 가 없는 상태**가 남아 시민 화면의 확률지도가 통째로 빈다.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header Cache-Control "no-store" always;
  }

  # 부팅 감시기가 오류를 흘려보내는 곳(scripts/patch-boot-guard.mjs).
  # 응답은 필요 없다 — **접근 로그에 남기는 것**이 목적이다. 사용자가 오류를
  # 옮겨 적지 않아도 `docker logs comeback-web | grep __boot` 으로 읽을 수 있다.
  # 여기가 없으면 try_files 가 index.html 을 통째로 돌려줘 로그가 지저분해진다.
  location = /__boot {
    return 204;
  }

  location / {
    try_files $uri /index.html;
  }
}
