<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">돌아오길 전체 아키텍처</title>
  <desc id="desc">보호자 온보딩부터 실종 신고, 위치 확률 예측, 시민 알림과 제보 갱신까지의 Phase 0~3 데이터 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAF8"/>
      <stop offset="1" stop-color="#EEF4F1"/>
    </linearGradient>
    <linearGradient id="phase2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173B35"/>
      <stop offset="1" stop-color="#24584E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
