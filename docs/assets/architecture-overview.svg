    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#527168"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D85B39"/>
    </marker>
    <style>
      .title { font: 700 34px Pretendard, "Apple SD Gothic Neo", sans-serif; fill: #173B35; }
      .subtitle { font: 500 17px Pretendard, "Apple SD Gothic Neo", sans-serif; fill: #5D746D; }
      .lane { font: 700 14px Pretendard, "Apple SD Gothic Neo", sans-serif; letter-spacing: 1.4px; fill: #668078; }
      .phase { font: 700 23px Pretendard, "Apple SD Gothic Neo", sans-serif; fill: #173B35; }
      .phaseLight { font: 700 23px Pretendard, "Apple SD Gothic Neo", sans-serif; fill: #FFFFFF; }
      .body { font: 500 16px Pretendard, "Apple SD Gothic Neo", sans-serif; fill: #38554D; }
      .bodyLight { font: 500 16px Pretendard, "Apple SD Gothic Neo", sans-serif; fill: #E7F1EE; }
      .small { font: 500 14px Pretendard, "Apple SD Gothic Neo", sans-serif; fill: #5D746D; }
      .smallLight { font: 500 14px Pretendard, "Apple SD Gothic Neo", sans-serif; fill: #CDE0DB; }
      .chip { font: 700 13px Pretendard, "Apple SD Gothic Neo", sans-serif; fill: #24584E; }
      .chipLight { font: 700 13px Pretendard, "Apple SD Gothic Neo", sans-serif; fill: #FFFFFF; }
      .edge { fill: none; stroke: #527168; stroke-width: 3; marker-end: url(#arrow); }
      .edgeDashed { fill: none; stroke: #D85B39; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow-accent); }
    </style>
  </defs>

